name: Deploy to hosting

# Publishes the site to the live server over SSH (rsync) on every push to main.
#
# Before the first real run, trigger this manually with dry-run enabled:
#   Actions > Deploy to hosting > Run workflow > tick "dry run"
# That prints exactly which files would be sent and transfers nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would transfer, send nothing"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      # Absolute path to the site root on the server. Override with the
      # DEPLOY_PATH repository variable if it ever moves.
      TARGET: ${{ vars.DEPLOY_PATH || '/opt/docker-projects/frontend-sites/baludaghanshyam.org' }}
      PORT: ${{ vars.SSH_PORT || '22' }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify required secrets are present
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$HOST" ] && missing="$missing SSH_HOST"
          [ -z "$USER" ] && missing="$missing SSH_USER"
          [ -z "$KEY" ]  && missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Configure SSH
        env:
          HOST: ${{ secrets.SSH_HOST }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Prefer a pinned host key. Fall back to scanning it on first use,
          # which trusts whatever answers - set the SSH_KNOWN_HOSTS secret
          # (output of: ssh-keyscan -p 22 <host>) to close that gap.
          if [ -n "${KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS not set - trusting the host key on first contact."
            ssh-keyscan -p "$PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Show what will be sent
        if: ${{ inputs.dry_run == true }}
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail
          echo "Target: $USER@$HOST:$TARGET (port $PORT)"
          echo "--- remote directory contents before deploy ---"
          ssh -i ~/.ssh/deploy_key -p "$PORT" "$USER@$HOST" \
            "ls -la '$TARGET' 2>/dev/null || echo '(directory does not exist yet)'"

      - name: Deploy
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          # --delete is off by default so a stray server-side file can never
          # be silently removed from production.
          #
          # Checked 2026-08-16: the target directory held only index.html,
          # logo.jpg and the two murti images - no compose file, no nginx
          # config - so enabling --delete is safe as things stand. Set the
          # DEPLOY_DELETE repository variable to "true" to turn it on, which
          # also clears out stale files that have been dropped from the repo.
          DELETE_FLAG=""
          if [ "${{ vars.DEPLOY_DELETE || 'false' }}" = "true" ]; then
            DELETE_FLAG="--delete"
          fi

          DRY_FLAG=""
          if [ "${{ inputs.dry_run || false }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo "DRY RUN - nothing will actually be written."
          fi

          rsync -rlvz --checksum --human-readable \
            $DRY_FLAG $DELETE_FLAG \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude '.claude/' \
            --exclude 'node_modules/' \
            --exclude 'README.md' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT" \
            ./ "$USER@$HOST:$TARGET/"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
